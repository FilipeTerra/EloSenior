<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nova despesa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; color: #1F1B2E; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 20px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px">Nova despesa</h1>
<a href="Despesas.dc.html" aria-label="Fechar" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #5B5870">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 14px">

<div>
<label for="valor" style="font-size: 15px; font-weight: 700; color: #5B5870">Valor</label>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; min-height: 68px; padding: 0 16px; border-radius: 18px; background: #fff; border: 2px solid #3D3489">
<span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; color: #5B5870">R$</span>
<input id="valor" type="text" inputmode="decimal" value="{{amount}}" onInput="{{onAmount}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 36px; color: #1F1B2E">
</div>
</div>

<div>
<div style="font-size: 15px; font-weight: 700; color: #5B5870; margin-bottom: 6px">Categoria</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 16px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.line}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div>
<div style="font-size: 15px; font-weight: 700; color: #5B5870; margin-bottom: 6px">Para quem foi o gasto</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{elders}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 16px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.line}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div>
<div style="font-size: 15px; font-weight: 700; color: #5B5870; margin-bottom: 6px">Quem pagou</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{payers}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 16px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.line}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; background: #fff; border: 1.5px solid #E6E0D6">
<span style="font-size: 16px; color: #5B5870">Data</span>
<strong style="font-size: 17px">Hoje, 13/11/2026</strong>
</div>

<button style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: transparent; border: 2px dashed #8E88B8; color: #3D3489; font-size: 17px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.3"/></svg>
Foto do comprovante (opcional)
</button>

</div>

<div style="padding: 12px 20px 24px; border-top: 1px solid #E6E0D6; background: #FAF7F2">
<a href="Despesas.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #3D3489; color: #fff; font-size: 18px; font-weight: 700">Salvar despesa</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { amount: '87,50', cat: 'Farmácia', elder: 'Maria', payer: 'Eu (Ana)' };
}
renderVals() {
const s = this.state;
const group = (labels, key) => labels.map((label) => {
const on = s[key] === label;
return {
label, on,
bg: on ? '#3D3489' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#1F1B2E',
line: on ? '#3D3489' : '#CFC9BD',
pick: () => this.setState({ [key]: label })
};
});
return {
amount: s.amount,
onAmount: (e) => this.setState({ amount: e.target.value }),
cats: group(['Farmácia', 'Consulta', 'Exame', 'Transporte', 'Plano de saúde', 'Outros'], 'cat'),
elders: group(['Maria', 'João', 'Geral da família'], 'elder'),
payers: group(['Eu (Ana)', 'O próprio idoso', 'Outra pessoa'], 'payer')
};
}
}
</script>
</body>
</html>
