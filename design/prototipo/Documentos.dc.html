<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Documentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAF7F2; color: #1F1B2E; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

<header style="padding: 20px 20px 12px">
<a href="Saude.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 16px; font-weight: 700; color: #3D3489">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
Maria Silva
</a>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px">Documentos</h1>
</header>

<div style="padding: 0 20px 10px">
<label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar documento</label>
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #fff; border: 1.5px solid #CFC9BD">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B5870" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<input id="busca" type="text" value="{{q}}" onInput="{{onQ}}" placeholder="Buscar por título ou médico" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; color: #1F1B2E">
</div>
</div>

<div style="display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 16px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.line}}">{{c.label}}</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 96px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #fff; border: 1.5px solid #E6E0D6">
<div style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #EEEBFA">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3489" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 17px; font-weight: 700">{{d.title}}</div>
<div style="font-size: 15px; color: #5B5870">{{d.meta}}</div>
<sc-if value="{{d.hasBadge}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 4px; display: inline-block; padding: 2px 10px; border-radius: 10px; background: #FFF8EC; border: 1px solid #E8B26A; font-size: 13px; font-weight: 700; color: #8A4B08">{{d.badge}}</div>
</sc-if>
</div>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 16px; text-align: center; font-size: 17px; color: #5B5870">Nenhum documento encontrado. Tente outra palavra ou outra categoria.</div>
</sc-if>
</div>

<button style="position: absolute; right: 20px; bottom: 90px; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 28px; background: #3D3489; color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 6px 16px rgba(61, 52, 137, 0.35)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.3"/></svg>
Fotografar documento
</button>

<nav aria-label="Navegação principal" style="display: flex; background: #fff; border-top: 1px solid #E6E0D6; padding: 8px 8px 12px">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; font-size: 13px; font-weight: 700; color: #5B5870">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 32px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Hoje</a>
<a href="Agenda.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; font-size: 13px; font-weight: 700; color: #5B5870">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 32px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Agenda</a>
<a href="Saude.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; font-size: 13px; font-weight: 700; color: #3D3489">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 32px; border-radius: 16px; background: #EEEBFA"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/><path d="M7 12h3l1.5-2.5 2 4 1.5-1.5H17"/></svg></span>Saúde</a>
<a href="Despesas.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; font-size: 13px; font-weight: 700; color: #5B5870">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 32px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="12" rx="2.5"/><circle cx="16" cy="14" r="1.2"/></svg></span>Despesas</a>
<a href="Familia.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; font-size: 13px; font-weight: 700; color: #5B5870">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 32px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M17.5 14c2.4.2 3.9 1.9 3.9 4.2"/></svg></span>Família</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: '', cat: 'Todos' };
}
renderVals() {
const norm = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const all = [
{ title: 'Hemograma completo', cat: 'Exame', meta: 'Exame · 02/11/2026 · Dra. Ana · 2 páginas' },
{ title: 'Receita de Losartana', cat: 'Receita', meta: 'Receita · 28/10/2026 · Dra. Ana', badge: 'Vence em 10 dias' },
{ title: 'Laudo do ecocardiograma', cat: 'Laudo', meta: 'Laudo · 15/09/2026 · Clínica Vida' },
{ title: 'Receita de Metformina', cat: 'Receita', meta: 'Receita · 05/09/2026 · Dr. Paulo' },
{ title: 'Carteirinha do plano de saúde', cat: 'Plano de saúde', meta: 'Plano de saúde · frente e verso' },
{ title: 'Raio-X de tórax', cat: 'Exame', meta: 'Exame · 20/08/2026 · Clínica Vida' }
];
const q = norm(this.state.q.trim());
const cat = this.state.cat;
const docs = all
.filter((d) => (cat === 'Todos' || d.cat === cat) && (q === '' || norm(d.title + ' ' + d.meta).includes(q)))
.map((d) => ({ ...d, hasBadge: !!d.badge }));
const defs = [['Todos', 'Todos'], ['Exame', 'Exames'], ['Receita', 'Receitas'], ['Laudo', 'Laudos'], ['Plano de saúde', 'Plano de saúde']];
const chips = defs.map(([key, label]) => {
const on = key === cat;
return {
label, on,
bg: on ? '#3D3489' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#1F1B2E',
line: on ? '#3D3489' : '#CFC9BD',
pick: () => this.setState({ cat: key })
};
});
return {
q: this.state.q,
onQ: (e) => this.setState({ q: e.target.value }),
chips,
docs,
empty: docs.length === 0
};
}
}
</script>
</body>
</html>
